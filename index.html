<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Off the Record</title>
    <meta name="description" content="Noticias de Ecuador en formato breve: qué pasó, por qué importa y qué sigue." />
    <meta name="theme-color" content="#111111" />

    <!-- Open Graph / social (WhatsApp es el canal principal de compartir) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="Off the Record" />
    <meta property="og:title" content="Off the Record" />
    <meta property="og:description" content="Noticias de Ecuador en formato breve: qué pasó, por qué importa y qué sigue." />
    <meta property="og:url" content="https://off-the-record-news-frontapp.vercel.app" />
    <meta property="og:image" content="https://off-the-record-news-frontapp.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fuentes: siempre con <link>, nunca @import dentro del SCSS inyectado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Free por CDN; iconos como <i class="fa-solid fa-…"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
